<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="pokeApi.css">
  <script src="pokeApi.js" defer></script>
  <title>Pokemon API</title>
</head>

<body>
  <div id="card">

    <div id="searchArea">
      <label for="pokemonInput">Name or ID</label>
      <div id="searchRow">
        <input
          type="text"
          id="pokemonInput"
          placeholder="e.g. skarmory or 227"
        >
        <button id="findBtn" type="button">Find</button>
      </div>
    </div>

    <div id="mediaArea">
      <img id="pokemonImg" alt="Pokemon sprite">
      <audio id="pokemonAudio" controls></audio>

    </div>

    <div id="movesArea">
      <select id="move1"></select>
      <select id="move2"></select>
      <select id="move3"></select>
      <select id="move4"></select>
    </div>

    <button id="addToTeamBtn" type="button">Add to Team</button>

    <section id="teamArea">
      <h3>Team</h3>
      <table id="teamTable">
        <tbody id="teamList"></tbody>
      </table>
    </section>

  </div>
</body>
</html>
